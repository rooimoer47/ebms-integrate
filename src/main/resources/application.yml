spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jms.activemq.ActiveMQAutoConfiguration
      - org.springframework.boot.autoconfigure.jms.JmsAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/ebms
    username: ebms
    password: ebms
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ebms-msh

ebms:
  cpa-directory: ${CPA_DIRECTORY:config/cpas}
  host-party-id: ${HOST_PARTY_ID:our-party}
  host-party-id-type: ${HOST_PARTY_ID_TYPE:}
  msh-id: ${MSH_ID:msh.ebms.dev}
  security:
    keystore-path: ${EBMS_KEYSTORE_PATH:}
    keystore-password: ${EBMS_KEYSTORE_PASSWORD:}
    keystore-alias: ${EBMS_KEYSTORE_ALIAS:ebms}
    truststore-path: ${EBMS_TRUSTSTORE_PATH:}
    truststore-password: ${EBMS_TRUSTSTORE_PASSWORD:}
  # jms.broker-url: set EBMS_JMS_BROKER_URL to enable ActiveMQ event publishing
  # jms.username / jms.password: optional credentials
