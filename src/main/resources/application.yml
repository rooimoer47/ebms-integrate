spring:
  autoconfigure:
    exclude:
      # Spring Boot 4 moved these; the old names are silently ignored, which would
      # leave JMS auto-configuration active for everyone instead of opt-in.
      - org.springframework.boot.activemq.autoconfigure.ActiveMQAutoConfiguration
      - org.springframework.boot.jms.autoconfigure.JmsAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/ebms
    username: ebms
    password: ebms
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    git:
      mode: full
  metrics:
    tags:
      application: ebms-msh

ebms:
  # Bootstrap only: the cpas table is the store of record. Files seed an empty store so that
  # docker-compose and CI come up with known CPAs; they never update or resurrect a row.
  cpa-directory: ${CPA_DIRECTORY:config/cpas}
  cpa-bootstrap-enabled: ${EBMS_CPA_BOOTSTRAP_ENABLED:true}
  # Every party id that is us, comma-separated. A list because this platform has more than one:
  # cpa-service answers the same question with cpa.default.server.oin, which carries two OINs.
  # Bare or urn:osb:oin:-prefixed, either matches. An XML CPA naming none of these is rejected
  # rather than routed on a guess.
  host-party-ids: ${HOST_PARTY_IDS:}
  host-party-id-type: ${HOST_PARTY_ID_TYPE:}
  msh-id: ${MSH_ID:msh.ebms.dev}
  security:
    # HTTP Basic over /service/rest/**, /api/** and the non-probe actuator endpoints. All three
    # clients already send these credentials. Startup fails if they are absent and auth is on.
    api:
      enabled: ${EBMS_API_AUTH_ENABLED:true}
      username: ${EBMS_API_USERNAME:}
      password: ${EBMS_API_PASSWORD:}
    keystore-path: ${EBMS_KEYSTORE_PATH:}
    keystore-password: ${EBMS_KEYSTORE_PASSWORD:}
    keystore-alias: ${EBMS_KEYSTORE_ALIAS:ebms}
    truststore-path: ${EBMS_TRUSTSTORE_PATH:}
    truststore-password: ${EBMS_TRUSTSTORE_PASSWORD:}
  # jms.broker-url: set EBMS_JMS_BROKER_URL to enable ActiveMQ event publishing
  # jms.username / jms.password: optional credentials
